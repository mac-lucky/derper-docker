name: Docker Image

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/**'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  security-events: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Gates publishing. Runs the image under no-new-privileges, which is the bit
  # Kubernetes sets via allowPrivilegeEscalation: false -- a plain docker run
  # will happily start images that cannot start in the cluster.
  smoke-test:
    name: Smoke test image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build --load -t derper-smoke .

      - name: Run smoke tests
        run: ./scripts/smoke-test.sh derper-smoke

  build:
    needs: smoke-test
    uses: mac-lucky/actions-shared-workflows/.github/workflows/docker-cicd-reusable.yml@master
    secrets:
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}
    with:
      app_name: "derper"
      dockerhub_image: "maclucky/derper"
      ghcr_image: "ghcr.io/mac-lucky/derper"
      upstream_repo: "tailscale/tailscale"
      version_strip_prefix: ""
      build_arg_name: "DERP_VERSION"
      enable_version_check: true
      enable_schedule_build: true
      enable_security_scan: true
      platforms: "linux/amd64,linux/arm64"
      govulncheck_binary: "/app/derper"