name: Auto Tag

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'entrypoint.sh'
      - 'scripts/smoke-test.sh'

# The tag is pushed with a mac-lucky-ci GitHub App token; the job token only reads.
permissions:
  contents: read

jobs:
  tag:
    uses: mac-lucky/actions-shared-workflows/.github/workflows/auto-tag-reusable.yml@master
    secrets:
      CI_APP_CLIENT_ID: ${{ secrets.CI_APP_CLIENT_ID }}
      CI_APP_PRIVATE_KEY: ${{ secrets.CI_APP_PRIVATE_KEY }}
    with:
      mode: upstream-arg
      arg_name: DERP_VERSION
